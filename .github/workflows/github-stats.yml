name: Update GitHub Stats Image

on:
  schedule:
    - cron: '0 0 * * *'  # runs daily at midnight UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latestname: Update GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Stats
        run: |
          curl -o stats.svg "https://github-readme-stats.vercel.app/api?username=Nayan993&show_icons=true&theme=dark&include_all_commits=true&count_private=true&token=${{ secrets.PAT_1 }}"
      - name: Commit and Push Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "Update GitHub stats"
          git push

    steps:
      - uses: actions/checkout@v3

      - name: Generate GitHub Stats SVG
        run: |
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -o github-stats.svg \
          "https://github-readme-stats.vercel.app/api?username=Nayan993&count_private=true&show_icons=true&theme=dark"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git commit -m "Update GitHub Stats" || echo "No changes to commit"
          git push
