name: Update GitHub Stats Image

on:
  schedule:
    - cron: '0 0 * * *'  # runs daily at midnight UTC
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate GitHub Stats SVG
        run: |
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -o github-stats.svg \
          "https://github-readme-stats.vercel.app/api?username=Nayan993&count_private=true&show_icons=true&theme=dark"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git commit -m "Update GitHub Stats" || echo "No changes to commit"
          git push
